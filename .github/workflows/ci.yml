# CI for Klarwerk (Block 9).
#
# Mirrors `npm run verify` locally, plus a Postgres service so the integration
# tests (apps/api/src/test/integration.test.ts) run against a real database.
# Everything here works without any external accounts.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saf
          POSTGRES_PASSWORD: saf
          POSTGRES_DB: smart_approval_flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saf -d smart_approval_flow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://saf:saf@localhost:5432/smart_approval_flow?schema=public
      # Deterministic, non-secret test values. NODE_ENV=test keeps the dev-header
      # auth path enabled for the integration suite.
      NODE_ENV: test
      AUTH_JWT_SECRET: ci-insecure-secret
      EMAIL_PROVIDER: console
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22: the built-in test runner needs >= 21 for glob patterns
          # (src/**/*.test.ts). Node 20 fails with "Could not find ... *.test.ts".
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Seed database (integration tests need the demo tenant)
        run: npm run seed --workspace packages/db

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      # Style check is informational for now: Prettier is not yet enforced
      # repo-wide and ESLint's flat-config migration is a deferred task (see
      # docs/testing-and-ci.md). It surfaces drift without blocking the build.
      - name: Format check (informational)
        run: npm run format:check
        continue-on-error: true

  # Playwright end-to-end + a11y smoke for the loginless customer page.
  # A SEPARATE job so it never destabilises `verify` (the primary gate). Marked
  # non-blocking for now (like format:check) while the browser layer settles —
  # see docs/e2e-testing.md. The node:test suites in `verify` remain the gate.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saf
          POSTGRES_PASSWORD: saf
          POSTGRES_DB: smart_approval_flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saf -d smart_approval_flow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://saf:saf@localhost:5432/smart_approval_flow?schema=public
      NODE_ENV: test
      AUTH_JWT_SECRET: ci-insecure-secret
      EMAIL_PROVIDER: console
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Seed database (E2E attaches cases to the demo tenant)
        run: npm run seed --workspace packages/db

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
        working-directory: apps/e2e

      - name: Run E2E + a11y smoke
        run: npm run e2e --workspace @saf/e2e

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # Release readiness (Block 18): boot the API exactly as production does and
  # smoke its liveness + DB-readiness probes. This is what catches a broken
  # production start path (e.g. an unrunnable entrypoint) that unit tests miss.
  # Deterministic and fast, so it gates.
  release-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saf
          POSTGRES_PASSWORD: saf
          POSTGRES_DB: smart_approval_flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saf -d smart_approval_flow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://saf:saf@localhost:5432/smart_approval_flow?schema=public
      # Production mode exercises the launch guard in apps/api/src/config.ts —
      # hence a real (non-default, 32+ char) secret and explicit provider knobs.
      NODE_ENV: production
      AUTH_JWT_SECRET: ci-release-smoke-secret-least-thirty-two-chars
      EMAIL_PROVIDER: console
      STORAGE_DRIVER: local
      API_PORT: '4000'
      API_BASE_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Production-start the API and smoke it
        run: |
          npm run start --workspace @saf/api &
          API_PID=$!
          npm run smoke --workspace @saf/api -- "$API_BASE_URL"
          SMOKE_RC=$?
          kill "$API_PID" 2>/dev/null || true
          exit $SMOKE_RC

  # Container smoke (Block 20): build the images, bring the whole stack up with
  # docker compose, then run the readiness smoke INSIDE the API container and
  # confirm the running build's version. This supersedes the plain image-build
  # job — it both validates the Dockerfiles and proves the containers actually
  # serve. NON-BLOCKING (container builds are slow and can't run in the local
  # dev sandbox); the app-level gates remain `verify` + `release-smoke`.
  # See docs/containerization.md.
  container-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      # Tags the images and is reported by /api/v1/health, so the smoke can
      # assert exactly which build is running.
      APP_VERSION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Build images (tagged with the commit SHA)
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the API container to be healthy
        run: |
          cid=$(docker compose ps -q api)
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)
            echo "api health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "API did not become healthy in time" >&2
          exit 1

      - name: Readiness smoke inside the API container
        run: docker compose exec -T api npm run smoke --workspace @saf/api -- http://127.0.0.1:4000

      - name: Assert /health reports the built version
        run: |
          version=$(curl -fsS http://localhost:4000/api/v1/health | tr -d ' ')
          echo "$version"
          echo "$version" | grep -q "\"version\":\"${APP_VERSION}\""

      - name: Web serves the home page
        run: curl -fsS -o /dev/null -w "web HTTP %{http_code}\n" http://localhost:3000

      - name: Dump container logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Tear down
        if: ${{ always() }}
        run: docker compose down -v
